# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/release-1.14/pkg/machinery/config/schemas/config.schema.json
# Grants system-upgrade namespace access to the Talos API: tuppr (os:admin)
# for Talos and Kubernetes upgrades, talos-backup (os:etcd:backup) for etcd
# snapshots.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - system-upgrade
