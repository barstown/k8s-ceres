apiVersion: v1alpha1
kind: KubeletConfig
config:
  crashLoopBackOff:
    maxContainerRestartPeriod: 60s
  kubeReserved:
    cpu: 100m
    memory: 512Mi
  evictionHard:
    memory.available: 200Mi
    nodefs.available: 10%
    nodefs.inodesFree: 5%
    imagefs.available: 15%
  evictionSoft:
    memory.available: 500Mi
  evictionSoftGracePeriod:
    memory.available: 1m30s
  evictionMaxPodGracePeriod: 60
  imageGCHighThresholdPercent: 75
  imageGCLowThresholdPercent: 70
  imageMaximumGCAge: 168h
  maxParallelImagePulls: 3
  serializeImagePulls: false
  shutdownGracePeriod: 90s
  shutdownGracePeriodCriticalPods: 60s
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/release-1.14/pkg/machinery/config/schemas/config.schema.json
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.0.50.0/24
