min_version = "2026.10.18"
monorepo_root = true

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
TALOSCONFIG = "{{config_root}}/talos/output/talosconfig"

[tools]
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:cli/cli" = "2.103.3"
"aqua:cloudflare/cloudflared" = "2026.10.6"
"aqua:derailed/k9s" = "0.51.0"
"aqua:doitintl/kube-no-trouble" = "0.7.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubecolor/kubecolor" = "0.8.0"
"aqua:kubernetes-sigs/kustomize" = "5.8.2"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.5"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"github:postfinance/topf" = "v0.6.2"
"node" = "26.13.0"
"npm:oxfmt" = "0.75.0"

# Shared log helper, called from project tasks as `mise run //:log`.
[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

# Each project's tasks live in <dir>/mise.toml and run from that directory,
# e.g. `mise run //talos:apply` (or `mise run apply` from inside talos/).
[monorepo]
config_roots = ["bootstrap", "kubernetes", "talos"]

[settings]
python.uv_venv_auto = "create|source"
task.quiet = true
