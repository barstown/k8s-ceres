[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
TALOSCONFIG = "{{config_root}}/talos/output/talosconfig"
JUST_UNSTABLE = "1"

[tools]
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:casey/just" = "1.58.0"
"aqua:charmbracelet/gum" = "2.0.1"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cli/cli" = "2.100.0"
"aqua:cloudflare/cloudflared" = "2026.9.1"
"aqua:derailed/k9s" = "0.51.0"
"aqua:doitintl/kube-no-trouble" = "0.7.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubecolor/kubecolor" = "0.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.14.0"
"aqua:yannh/kubeconform" = "0.8.0"
"github:postfinance/topf" = "v0.6.0"
"npm:oxfmt" = "0.67.0"

[settings]
python.uv_venv_auto = "create|source"
