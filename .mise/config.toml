min_version = "2026.10.18"
monorepo_root = true

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
TALOSCONFIG = "{{config_root}}/talos/output/talosconfig"

[tools]
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:cilium/cilium-cli" = "0.20.3"
"aqua:cli/cli" = "2.106.0"
"aqua:cloudflare/cloudflared" = "2026.11.2"
"aqua:derailed/k9s" = "0.51.0"
"aqua:doitintl/kube-no-trouble" = "0.7.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.1"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.6"
"aqua:home-operations/flate" = "0.8.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:kubecolor/kubecolor" = "0.9.0"
"aqua:kubernetes-sigs/kustomize" = "5.8.2"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.3"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:siderolabs/talos" = "1.14.7"
"aqua:utkuozdemir/pv-migrate" = "3.8.0"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:zizmorcore/zizmor" = "1.33.1"
"github:postfinance/topf" = "v0.6.2"
"node" = "26.13.1"
"npm:oxfmt" = "0.80.0"

# Shared log helper, called from project tasks as `mise run //:log`.
[tasks.log]
hide = true
# Without this, every log line is preceded by its own `$ gum log ...` line.
quiet = true
run = "gum log -t rfc3339 -s -l"

[tasks.lint]
description = "Run every linter"
depends = ["lint:*"]

# actionlint also runs shellcheck on each workflow `run:` block.
[tasks."lint:actionlint"]
description = "Lint GitHub Actions workflows"
run = "actionlint -color"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions workflows for security issues"
run = "zizmor --color=always --no-progress .github"

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

# Each project's tasks live in <dir>/mise.toml and run from that directory,
# e.g. `mise run //talos:apply` (or `mise run apply` from inside talos/).
[monorepo]
config_roots = ["bootstrap", "kubernetes", "talos"]

[settings]
python.uv_venv_auto = "create|source"
