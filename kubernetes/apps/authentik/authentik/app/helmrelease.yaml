---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              version: v1
            patch: |
              - op: add
                path: "/metadata/labels/app.ceres.io~1depends-on-postgresql"
                value: "true"
  values:
    global:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      podLabels:
        app.ceres.io/egress-internet: "true"
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-app-secret
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__HOST
          valueFrom:
            secretKeyRef:
              name: &db-secret authentik-db-secret
              key: host
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: *db-secret
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: *db-secret
              key: password
        - name: AUTHENTIK_POSTGRESQL__NAME
          valueFrom:
            secretKeyRef:
              name: *db-secret
              key: database
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsUser: 65534
    authentik:
      enabled: true
      error_reporting:
        enabled: false
    blueprints:
      configMaps:
        - authentik-blueprints
    server:
      containerPorts:
        http: &port 9000
        https: 9443
        metrics: 9300
      env:
        - name: AUTHENTIK_LOG_LEVEL
          value: info
      resources:
        requests:
          cpu: 100m
          memory: 700Mi
        limits:
          memory: 1Gi
      route:
        internal:
          enabled: true
          hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          rules:
            - backendRefs:
                - identifier: app
                  port: *port
      containerSecurityContext: &securityContext
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile: { type: RuntimeDefault }
        capabilities: { drop: ["ALL"] }
    worker:
      podLabels:
        app.ceres.io/egress-kube-apiserver: "true"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
      containerSecurityContext: *securityContext
    postgresql:
      enabled: false
