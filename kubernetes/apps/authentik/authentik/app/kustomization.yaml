---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster.yaml
  - ./objectstore.yaml
  - ./scheduledbackup.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./referencegrant.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - ceres-access.yaml=./resources/ceres-access.yaml
      - ceres-system.yaml=./resources/ceres-system.yaml
    options:
      annotations:
        reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
