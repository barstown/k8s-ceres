---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-postgres
spec:
  description: barman backups to S3
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik-postgres
  egress:
    - toFQDNs:
        - matchName: truenas.lab.${INTERNAL_DOMAIN}
      toPorts:
        - ports:
            - port: "30292"
              protocol: TCP
    - toCIDR:
        - 10.0.10.50/32
      toPorts:
        - ports:
            - port: "30292"
              protocol: TCP
