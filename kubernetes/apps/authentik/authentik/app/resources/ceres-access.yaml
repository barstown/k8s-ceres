  - model: authentik_providers_proxy.proxyprovider
    id: kapowarr-provider
    identifiers:
      name: Provider for kapowarr
    attrs:
      mode: forward_single
      external_host: https://kapowarr.${SECRET_DOMAIN}
      authorization_flow: !Find
        - authentik_flows.flow
