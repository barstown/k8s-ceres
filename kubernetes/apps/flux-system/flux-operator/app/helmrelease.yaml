---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.62.1
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      enabled: true
