---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    env:
      # RENOVATE_PRINT_CONFIG: "true" # debugging
      LOG_LEVEL: INFO
      RENOVATE_AUTODISCOVER_FILTER: "barstown/*, !barstown/kubernetes-rke2, !barstown/kubernetes2"
      RENOVATE_AUTODISCOVER: "true"
      RENOVATE_DRY_RUN: "null"
      RENOVATE_GIT_AUTHOR: "Renovate Bot <30529916+barstown@users.noreply.github.com>"
      RENOVATE_REPORT_TYPE: logging
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_TIMEZONE: "America/New_York"
      RENOVATE_X_GITHUB_HOST_RULES: "true"
    envFrom:
      - secretRef:
          name: renovate-secrets
    cronjob:
      concurrencyPolicy: Replace
      failedJobsHistoryLimit: 4
      jobBackoffLimit: 1
      schedule: "0 */3 * * *"
      successfulJobsHistoryLimit: 4
      timeZone: America/New_York
      ttlSecondsAfterFinished: 46800
    renovate:
      config: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            "config:best-practices",
            "security:openssf-scorecard"
          ],
          "timezone": "America/New_York",
          "dependencyDashboardOSVVulnerabilitySummary": "all",
          "osvVulnerabilityAlerts": true,
          "packageRules": [
            {
              "description": "Link fedora.linux_system_roles galaxy-collection changelog",
              "matchDatasources": ["galaxy-collection"],
              "matchPackageNames": ["fedora.linux_system_roles"],
              "sourceUrl": "https://github.com/linux-system-roles/auto-maintenance"
            }
          ]
        }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      persistence:
        cache:
          enabled: true
          storageClass: "freenas-api-iscsi"
          storageSize: "10Gi"
