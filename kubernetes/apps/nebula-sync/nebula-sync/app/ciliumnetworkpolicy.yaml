---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nebula-sync
spec:
  description: Pi-hole APIs
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nebula-sync
  egress:
    - toCIDR:
        - 10.0.10.20/32
        - 10.0.10.22/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
