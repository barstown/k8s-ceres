---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  install:
    disableSchemaValidation: true # the chart schema rejects the kubernetes acquisition source
  interval: 1h
  upgrade:
    disableSchemaValidation: true
  values:
    container_runtime: containerd # the default (docker) mounts /var/lib/docker/containers into the agent
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
      tag: v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    config:
      parsers:
        s02-enrich:
          envoy-ext-authz-whitelist.yaml: |
            name: ceres/envoy-ext-authz-whitelist
            description: "Ignore requests already denied by the CrowdSec bouncer"
            whitelist:
              reason: "envoy ext_authz denial (UAEX)"
              expression:
                - evt.Unmarshaled.envoy?.response_flags != nil && "UAEX" in Split(evt.Unmarshaled.envoy.response_flags, ",")
          immich-android-whitelist.yaml: |
            name: ceres/immich-android-whitelist
            description: "Ignore Immich Android app API 404s from the public proxy"
            whitelist:
              reason: "immich-android API call to immich-public-proxy"
              expression:
                - evt.Meta.target_fqdn == "immich.asteroids.sh" && evt.Meta.http_user_agent startsWith "immich-android/" && evt.Meta.http_status == "404"
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      deployAnnotations:
        reloader.stakater.com/auto: "true"
      envFrom:
        - secretRef:
            name: crowdsec-secret
      persistentVolume:
        config:
          size: 1Gi # xfs needs >= 300MB; the chart default (100Mi) fails mkfs
        data:
          storageClassName: freenas-api-iscsi-sqlite
          size: 1Gi
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
      metrics:
        serviceMonitor:
          enabled: true
