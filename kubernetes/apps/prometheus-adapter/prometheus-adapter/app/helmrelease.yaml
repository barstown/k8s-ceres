---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/prometheus-community/charts/prometheus-adapter
  interval: 1h
  values:
    prometheus:
      url: http://vmsingle-victoria-metrics-cluster.o11y.svc.cluster.local # TODO update once victoria metrics is deployed
      port: 8428
    rules:
      default: false
      external:
        - seriesQuery: '{__name__="probe_success"}'
          resources:
            namespaced: false
          name:
            as: probe_success
          metricsQuery: max_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])
