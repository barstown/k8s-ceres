---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  values:
    fullnameOverride: victoria-logs-collector
    collector:
      excludeFilter: kubernetes.container_name:=csi-proxy
      msgField: [message, msg, log, event, error]
    global:
      image:
        registry: quay.io
    podLabels:
      app.ceres.io/egress-kube-apiserver: "true"
    podMonitor:
      enabled: true
    remoteWrite:
      - url: http://victoria-logs.victoria-logs.svc.cluster.local:9428
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
