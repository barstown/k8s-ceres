---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: freenas-api-iscsi
        size: 50Gi
      retentionPeriod: 90d
      retentionMaxDiskUsagePercent: 85
      syslog:
        udp:
          - name: syslog-udp
            # Unprivileged port; the syslog Service maps 514 to it
            value: :5514
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 3Gi
      podSecurityContext:
        enabled: true
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        enabled: true
        readOnlyRootFilesystem: true
        seccompProfile: { type: RuntimeDefault }
      route:
        enabled: true
        hostnames: ["vlogs.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      serviceMonitor:
        enabled: true
