---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    replicaCount: 1
    podLabels:
      app.ceres.io/egress-internet: "true"
      app.ceres.io/egress-kube-apiserver: "true"
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
    cainjector:
      podLabels:
        app.ceres.io/egress-kube-apiserver: "true"
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
    webhook:
      podLabels:
        app.ceres.io/egress-kube-apiserver: "true"
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
    startupapicheck:
      podLabels:
        app.ceres.io/egress-kube-apiserver: "true"
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
