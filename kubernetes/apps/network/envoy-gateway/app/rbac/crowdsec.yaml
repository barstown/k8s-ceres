---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
# Allows the CrowdSec agent to read envoy-external proxy logs in this namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-agent
subjects:
  - kind: ServiceAccount
    name: crowdsec-agent
    namespace: crowdsec
