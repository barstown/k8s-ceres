---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-backup
spec:
  description: Talos API on the nodes and S3 on TrueNAS
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: talos-backup
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    - toCIDR:
        - 10.0.10.50/32 # truenas.lab.${INTERNAL_DOMAIN}
        - 10.0.50.200/32 # truenas.ceres.internal
      toPorts:
        - ports:
            - port: "30292"
              protocol: TCP
