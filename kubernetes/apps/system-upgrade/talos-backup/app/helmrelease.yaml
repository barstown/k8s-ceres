---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-backup
spec:
  chartRef:
    kind: OCIRepository
    name: talos-backup
  interval: 1h
  values:
    controllers:
      talos-backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          schedule: "0 3 * * *"
          successfulJobsHistory: 3
          timeZone: America/New_York
          ttlSecondsAfterFinished: 86400
        pod:
          restartPolicy: OnFailure
        containers:
          main:
            image:
              repository: ghcr.io/siderolabs/talos-backup
              tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
            workingDir: /tmp
            env:
              AWS_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: rustfs-secrets
                    key: RUSTFS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: rustfs-secrets
                    key: RUSTFS_ACCESS_SECRET_KEY
              AWS_REGION: us-east-1
              CUSTOM_S3_ENDPOINT: https://truenas.lab.${INTERNAL_DOMAIN}:30292
              USE_PATH_STYLE: "true"
              BUCKET: k8s-ceres
              S3_PREFIX: talos-backup
              CLUSTER_NAME: ceres
              ENABLE_COMPRESSION: "true"
              # Same age recipient as .sops.yaml; decrypt with the SOPS private key
              AGE_RECIPIENT_PUBLIC_KEY: age1vcetgycw8e62xe34yfu3kqxcxrcrht0ddacvtae9ardxg6qqqyqqskllu6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
              seccompProfile: { type: RuntimeDefault }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      talos:
        type: emptyDir
        globalMounts:
          - path: /.talos
      talos-secrets:
        type: secret
        name: talos-backup
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
