---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/talos.dev/serviceaccount_v1alpha1.json
# Talos issues a talosconfig into the Secret of the same name, scoped to the
# requested roles. Requires the role and namespace to be allowed by
# KubeTalosAPIAccessConfig (talos/control-plane/20-features.yaml).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup
spec:
  roles:
    - os:etcd:backup
