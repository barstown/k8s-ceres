---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json

apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.7
  policy:
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: status.phase == "Cluster in healthy state" && status.topology.nodesUsed == object.spec.instances
  # maintenance:
  #   windows:
  #     - start: "0 2 * * 0"
  #       duration: "4h"
  #       timezone: "America/New_York"
