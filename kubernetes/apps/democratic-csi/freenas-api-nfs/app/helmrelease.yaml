---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freenas-api-nfs
spec:
  chartRef:
    kind: OCIRepository
    name: freenas-api-nfs
  interval: 1h
  values:
    csiDriver:
      name: freenas-api-nfs
    controller:
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          tag: v1.9.5
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
    driver:
      existingConfigSecret: freenas-api-nfs-driver-config
      config:
        driver: freenas-api-nfs
    node:
      driver:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
    storageClasses:
      - name: freenas-api-nfs
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
          detachedVolumesFromSnapshots: "false"
        mountOptions:
          - nfsvers=3
          - noatime
          - nolock
    volumeSnapshotClasses:
      - name: freenas-api-nfs
        parameters:
          detachedSnapshots: "true"
