---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
spec:
  chart:
    spec:
      chart: truenas-csi
      version: 1.4.0
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: truenas-csi-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: truenas-csi-node
              spec:
                template:
                  spec:
                    volumes:
                      - name: iscsi-dir
                        hostPath:
                          path: /var/iscsi
                          type: ""
  values:
    truenas:
      url: wss://10.0.10.50/api/current
      defaultPool: storage
      nfsServer: 10.0.10.50
      iscsiPortal: 10.0.10.50:3260
      insecureSkipTLS: true
      existingSecret: truenas-csi-secret
      existingSecretKey: api-key
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    storageClasses:
      - name: truenas-iscsi
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - noatime
        parameters:
          protocol: iscsi
          datasetPath: k8s/truenas-csi/iscsi
          csi.storage.k8s.io/fstype: xfs
          volblocksize: 16K
          iscsi.blocksize: "4096"
          sparse: "true"
      - name: truenas-iscsi-postgresql
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - noatime
        parameters:
          protocol: iscsi
          datasetPath: k8s/truenas-csi/iscsi
          csi.storage.k8s.io/fstype: xfs
          volblocksize: 8K
          iscsi.blocksize: "4096"
          sparse: "true"
      - name: truenas-iscsi-sqlite
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - noatime
        parameters:
          protocol: iscsi
          datasetPath: k8s/truenas-csi/iscsi
          csi.storage.k8s.io/fstype: xfs
          volblocksize: 4K
          iscsi.blocksize: "4096"
          sparse: "true"
      - name: truenas-nfs
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - nfsvers=3
          - noatime
          - nolock
        parameters:
          protocol: nfs
          datasetPath: k8s/truenas-csi/nfs
          nfs.rootSquash: "false"
