---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-server
spec:
  description: Immich Public Proxy access to the Immich server
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich-public-proxy
            app.kubernetes.io/name: immich-public-proxy
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
