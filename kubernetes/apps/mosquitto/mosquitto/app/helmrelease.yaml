---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: mosquitto
  interval: 1h
  values:
    controllers:
      mosquitto:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          init-config:
            image: &image
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
            command: ["/bin/sh", "-c"]
            args:
              - |
                umask 077
                cp /mosquitto/config/acl /mosquitto/auth/acl
                cp /mosquitto/secret/mosquitto_pwd /mosquitto/auth/passwd
                mosquitto_passwd -U /mosquitto/auth/passwd
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
              seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image: *image
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
        # statefulset:
        #   volumeClaimTemplates:
        #     - name: config
        #       storageClass: freenas-api-iscsi
        #       accessMode: ReadWriteOnce
        #       size: 5Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    service:
      app:
        # type: LoadBalancer
        # annotations:
        #   external-dns.alpha.kubernetes.io/hostname: "{{ .Release.Name }}.${SECRET_DOMAIN}"
        #   lbipam.cilium.io/ips: "10.0.50.7"
        # externalTrafficPolicy: Local
        ports:
          mqtt:
            port: 1883
    configMaps:
      config-file:
        data:
          acl: |-
            user zigbee2mqtt
            topic readwrite zigbee2mqtt/#
            topic readwrite homeassistant/#

            user home-assistant
            topic readwrite zigbee2mqtt/#
            topic readwrite homeassistant/#
          mosquitto.conf: |-
            acl_file /mosquitto/auth/acl
            allow_anonymous false
            autosave_interval 60
            connection_messages false
            listener 1883
            password_file /mosquitto/auth/passwd
            persistence true
            persistence_location /config
    persistence:
      auth:
        type: emptyDir
        globalMounts:
          - path: /mosquitto/auth
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: freenas-api-iscsi
      config-file:
        type: configMap
        identifier: config-file
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
        advancedMounts:
          mosquitto:
            init-config:
              - path: /mosquitto/config/acl
                subPath: acl
                readOnly: true
      secret-file:
        type: secret
        name: mosquitto-secret
        advancedMounts:
          mosquitto:
            init-config:
              - path: /mosquitto/secret
                readOnly: true
      tmp:
        type: emptyDir
