---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        dns_external:
          prober: dns
          timeout: 5s
          dns:
            query_name: cloudflare.com
            query_type: A
            transport_protocol: udp
            preferred_ip_protocol: ip4
            ip_protocol_fallback: false
            valid_rcodes: ["NOERROR"]
            validate_answer_rrs:
              fail_if_not_matches_regexp:
                - "IN\\s+A\\s+"
        dns_local:
          prober: dns
          timeout: 5s
          dns:
            query_name: truenas.lab.internal
            query_type: A
            transport_protocol: udp
            preferred_ip_protocol: ip4
            ip_protocol_fallback: false
            valid_rcodes: ["NOERROR"]
            validate_answer_rrs:
              fail_if_not_matches_regexp:
                - "IN\\s+A\\s+10\\.0\\.10\\.50"
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: InfrastructureProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter", tier="infrastructure"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: |-
              The {{ $labels.job }} probe targeting {{ $labels.instance }} is failing
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter", tier="lan"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: |-
              The {{ $labels.job }} probe targeting {{ $labels.instance }} is failing
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    podSecurityContext:
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      readOnlyRootFilesystem: true
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile: { type: RuntimeDefault }
