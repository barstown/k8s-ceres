---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox-exporter
spec:
  description: ICMP, DNS and TCP probes to LAN infrastructure
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  egress:
    - toCIDR:
        - 10.0.10.5/32 # proxmox.lab.internal
        - 10.0.10.20/32
        - 10.0.10.22/32
        - 10.0.10.50/32 # truenas.lab.internal
        - 10.0.10.176/32 # tailscaled.lab.internal
        - 10.0.50.1/32 # unifi.ceres.internal
        - 172.16.100.254/32 # smlight.iot.internal
      icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
    - toCIDR:
        - 10.0.10.20/32
        - 10.0.10.22/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toCIDR:
        - 10.0.10.50/32 # truenas.lab.internal
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
            - port: "3260"
              protocol: TCP
    - toCIDR:
        - 10.0.10.5/32 # proxmox.lab.internal
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
