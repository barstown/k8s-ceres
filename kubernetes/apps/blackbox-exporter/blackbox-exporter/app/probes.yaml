---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infrastructure-icmp
spec:
  module: icmp
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 10.0.10.20
        - 10.0.10.22
        - truenas.lab.internal
        - unifi.ceres.internal
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter
      action: replace
    - targetLabel: tier
      replacement: infrastructure
      action: replace
