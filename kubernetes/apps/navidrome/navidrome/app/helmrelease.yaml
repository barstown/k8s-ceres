---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
spec:
  chartRef:
    kind: OCIRepository
    name: navidrome
  interval: 1h
  values:
    controllers:
      navidrome:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          plugins:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            env:
              # renovate: datasource=github-releases depName=navidrome/apple-music-plugin
              APPLE_MUSIC_VERSION: v0.2.0
              # renovate: datasource=github-releases depName=NeptuneHub/AudioMuse-AI-NV-plugin
              AUDIOMUSEAI_VERSION: v12
              # renovate: datasource=github-releases depName=nenadjokic/navibeat-mixes
              NAVIBEAT_MIXES_VERSION: v0.9.29
              # renovate: datasource=github-releases depName=J0R6IT0/navidrome-lyrics-plugin
              ND_LYRICS_VERSION: v9.0.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                fetch() {
                  tmp="/data/plugins/.$$4.tmp"
                  if curl -fsSL --retry 3 -o "$$tmp" "https://github.com/$$1/releases/download/$$2/$$3"; then
                    mv "$$tmp" "/data/plugins/$$4"
                  else
                    rm -f "$$tmp"
                    echo "$$4 download failed"
                  fi
                }
                mkdir -p /data/plugins
                fetch navidrome/apple-music-plugin "$${APPLE_MUSIC_VERSION}" apple-music.ndp apple-music.ndp
                fetch NeptuneHub/AudioMuse-AI-NV-plugin "$${AUDIOMUSEAI_VERSION}" audiomuseai.ndp audiomuseai.ndp
                fetch nenadjokic/navibeat-mixes "$${NAVIBEAT_MIXES_VERSION}" navibeat-mixes-navidrome-0.64.ndp navibeat-mixes.ndp
                fetch J0R6IT0/navidrome-lyrics-plugin "$${ND_LYRICS_VERSION}" nd-lyrics.ndp nd-lyrics.ndp
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
              seccompProfile: { type: RuntimeDefault }
          plugins-enable:
            dependsOn: plugins
            image: &image
              repository: ghcr.io/navidrome/navidrome
              tag: 0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
            command: ["/bin/sh", "-c"]
            args:
              - |
                enabled=$$(navidrome plugin list -f csv | awk -F, '/,true,$$/ {print $$1}')
                navidrome plugin rescan
                for id in $$enabled; do
                  navidrome plugin enable "$$id" || echo "$$id could not be re-enabled"
                done
            securityContext: *securityContext
        containers:
          app:
            image: *image
            env:
              ND_AGENTS: "audiomuseai,apple-music,deezer,lastfm,listenbrainz"
              ND_ENABLEINSIGHTSCOLLECTOR: false
              ND_LOGLEVEL: info
              ND_LYRICSPRIORITY: ".ttml,.yaml,.yml,.elrc,.lrc,.srt,.txt,embedded,nd-lyrics"
              ND_MUSICFOLDER: "/music"
              ND_PLUGINS_AUTORELOAD: true
              ND_PLUGINS_ENABLED: true
              ND_PORT: &port 4533
              TZ: America/New_York
            # envFrom:
            #   - secretRef:
            #       name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
              limits:
                cpu: 2000m
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 2002 # media-ro
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2020 # navidrome
        runAsNonRoot: true
        runAsUser: 2020 # navidrome
    service:
      app:
        ports:
          http:
            port: *port
    route:
      external:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: freenas-api-iscsi-sqlite
      media:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}-media"
        advancedMounts:
          navidrome:
            app:
              - path: /music
                subPath: music
      tmp:
        type: emptyDir
