# kubectl reads data for scripting; kubecolor prints output meant for humans.

[tasks.reconcile]
description = "Force Flux to pull in changes from your Git repository"
run = "flux --namespace flux-system reconcile kustomization flux-system --with-source"

# See docs/postgresql-cnpg-maintenance.md for when to use each of these.

# The label is only on the Deployments (not their pods), so "down" waits on
# Deployment status rather than on pods.
[tasks.pg-apps]
description = "Scale PostgreSQL-dependent Deployments down to zero or up to one replica"
usage = '''
arg "<action>" help="down scales to 0 and waits for pods to stop; up scales to 1" {
  choices "down" "up"
}
'''
run = '''
selector=app.ceres.io/depends-on-postgresql=true
case "${usage_action}" in
    down) replicas=0 ;;
    up) replicas=1 ;;
esac
kubectl get deploy -A -l "$selector" -o json \
    | yq -r '.items[] | .metadata.namespace + " " + .metadata.name' \
    | while read -r ns name; do kubecolor -n "$ns" scale deploy "$name" --replicas="$replicas"; done
[[ "${usage_action}" == down ]] || exit 0
deadline=$((SECONDS + 300))
until (( $(kubectl get deploy -A -l "$selector" -o json \
        | yq '.items[] as $d ireduce (0; . + ($d.status.replicas // 0) + ($d.status.terminatingReplicas // 0))') == 0 )); do
    (( SECONDS < deadline )) || mise run //:log fatal "Timed out waiting for apps to stop"
    sleep 5
done
mise run //:log info "PostgreSQL-dependent apps stopped"
'''

# Owning Flux Kustomizations are suspended while hibernated so they don't
# revert the annotation (Git sets cnpg.io/hibernation=off), and only resumed
# once every cluster is back to its full instance count.
[tasks.pg-hibernation]
description = "Hibernate (on) or wake (off) all CNPG clusters"
usage = '''
arg "<state>" help="on suspends Flux owners then hibernates; off wakes, waits for Ready, then resumes" {
  choices "on" "off"
}
'''
run = '''
clusters="$(kubectl get clusters.postgresql.cnpg.io -A -o json)"
flux_owners() {
    yq -r '.items[] | .metadata.labels."kustomize.toolkit.fluxcd.io/name" | select(. != null and . != "")' <<< "$clusters" \
        | sort -u \
        | xargs -r -I{} flux --namespace flux-system "$1" kustomization {}
}
annotate() {
    yq -r '.items[] | .metadata.namespace + " " + .metadata.name' <<< "$clusters" \
        | while read -r ns name; do
            kubecolor -n "$ns" annotate cluster.postgresql.cnpg.io "$name" \
                --overwrite --field-manager=flux-client-side-apply cnpg.io/hibernation="$1"
        done
}
case "${usage_state}" in
    on)
        flux_owners suspend
        annotate on
        ;;
    off)
        annotate off
        deadline=$((SECONDS + 600))
        until (( $(kubectl get clusters.postgresql.cnpg.io -A -o json \
                | yq '[.items[] | select((.status.readyInstances // 0) != .spec.instances)] | length') == 0 )); do
            (( SECONDS < deadline )) \
                || mise run //:log fatal "Timed out waiting for CNPG clusters; their Flux Kustomizations are still suspended"
            sleep 10
        done
        mise run //:log info "CNPG clusters ready"
        flux_owners resume
        ;;
esac
'''

[tasks.pg-maintenance]
description = "Stop apps and hibernate CNPG clusters (start), or wake clusters and restart apps (end)"
usage = '''
arg "<phase>" help="start: pg-apps down, pg-hibernation on; end: pg-hibernation off, pg-apps up" {
  choices "start" "end"
}
'''
run = '''
case "${usage_phase}" in
    start)
        mise run //kubernetes:pg-apps down
        mise run //kubernetes:pg-hibernation on
        mise run //:log info "PostgreSQL maintenance started, run 'mise run //kubernetes:pg-maintenance end' when done"
        ;;
    end)
        mise run //kubernetes:pg-hibernation off
        mise run //kubernetes:pg-apps up
        mise run //:log info "PostgreSQL maintenance ended"
        ;;
esac
'''

[tasks.drain]
description = "Drain a Kubernetes node"
usage = '''
arg "<node>" help="Node name from topf.yaml"
arg "[args]..." var=#true help="Extra flags passed to kubectl drain"
complete "node" run="yq '.nodes[].host' \"$(git rev-parse --show-toplevel)/talos/topf.yaml\""
'''
run = '''
eval "set -- ${usage_args:-}"
kubecolor drain "${usage_node}" --ignore-daemonsets --delete-emptydir-data "$@"
'''

[tasks.uncordon]
description = "Uncordon a Kubernetes node"
usage = '''
arg "<node>" help="Node name from topf.yaml"
arg "[args]..." var=#true help="Extra flags passed to kubectl uncordon"
complete "node" run="yq '.nodes[].host' \"$(git rev-parse --show-toplevel)/talos/topf.yaml\""
'''
run = '''
eval "set -- ${usage_args:-}"
kubecolor uncordon "${usage_node}" "$@"
'''

[tasks.crowdsec-decisions]
description = "List active CrowdSec decisions (bans)"
usage = '''
arg "[args]..." var=#true help="Extra flags passed to cscli decisions list"
'''
run = '''
eval "set -- ${usage_args:-}"
kubecolor -n crowdsec exec deploy/crowdsec-lapi -- cscli decisions list "$@"
'''

[tasks.crowdsec-unban]
description = "Delete CrowdSec decisions (unban) for an IP or CIDR range"
usage = 'arg "<target>" help="IP address or CIDR range"'
run = '''
if [[ "${usage_target}" == */* ]]; then flag=--range; else flag=--ip; fi
kubecolor -n crowdsec exec deploy/crowdsec-lapi -- cscli decisions delete "$flag" "${usage_target}"
'''
