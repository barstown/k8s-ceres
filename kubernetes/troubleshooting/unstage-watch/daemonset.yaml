---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/daemonset_v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unstage-watch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unstage-watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unstage-watch
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostPID: true
      terminationGracePeriodSeconds: 5
      containers:
        - name: watch
          image: docker.io/library/python:3.13.18-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command: ["python3", "-u", "/app/unstage_watch.py"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: pods-log
              mountPath: /host/var/log/pods
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: unstage-watch
        - name: pods-log
          hostPath:
            path: /var/log/pods
            type: Directory
